name: Update VPS RapidAPI env

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-rapidapi-env
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert RapidAPI key on VPS and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: RAPIDAPI_KEY
          script: |
            set -euo pipefail
            cd /opt/ghost-translator

            if [[ -z "${RAPIDAPI_KEY:-}" ]]; then
              echo "ERROR: RAPIDAPI_KEY secret is empty" >&2
              exit 1
            fi

            tmp="$(mktemp)"
            grep -vE '^(RAPIDAPI_KEY|AZURE_TRANSLATOR_KEY|AZURE_TRANSLATOR_REGION|AZURE_TRANSLATOR_ENDPOINT)=' .env > "$tmp" || true
            printf '%s\n' "RAPIDAPI_KEY=${RAPIDAPI_KEY}" >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env

            docker compose -f compose.vps.yml up -d --force-recreate ghost-translator

            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8082/health >/dev/null; then
                curl -fsS http://127.0.0.1:8082/status
                echo
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: health check failed" >&2
            docker compose -f compose.vps.yml logs --tail=50 ghost-translator || true
            exit 1
