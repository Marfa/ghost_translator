name: Update VPS Azure env

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-azure-env
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert Azure Translator keys on VPS and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: AZURE_TRANSLATOR_KEY,AZURE_TRANSLATOR_REGION
          script: |
            set -euo pipefail
            cd /opt/ghost-translator

            if [[ -z "${AZURE_TRANSLATOR_KEY:-}" || -z "${AZURE_TRANSLATOR_REGION:-}" ]]; then
              echo "ERROR: AZURE_TRANSLATOR_KEY/REGION secrets are empty" >&2
              exit 1
            fi

            tmp="$(mktemp)"
            grep -vE '^(AZURE_TRANSLATOR_KEY|AZURE_TRANSLATOR_REGION|AZURE_TRANSLATOR_ENDPOINT)=' .env > "$tmp" || true
            printf '%s\n' "AZURE_TRANSLATOR_KEY=${AZURE_TRANSLATOR_KEY}" >> "$tmp"
            printf '%s\n' "AZURE_TRANSLATOR_REGION=${AZURE_TRANSLATOR_REGION}" >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env

            docker compose -f compose.vps.yml up -d --force-recreate ghost-translator

            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8082/health >/dev/null; then
                curl -fsS http://127.0.0.1:8082/status
                echo
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: health check failed" >&2
            docker compose -f compose.vps.yml logs --tail=50 ghost-translator || true
            exit 1
