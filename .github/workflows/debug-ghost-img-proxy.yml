name: Debug ghost img proxy

on:
  workflow_dispatch:

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug from VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "=== curl gimg ==="
            curl -sSI --connect-timeout 10 --max-time 20 \
              'https://feeds.themarfa.name/gimg/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg' \
              | head -n 15 || true
            echo "=== last error lines with gimg ==="
            grep gimg /var/log/nginx/error.log | tail -n 10 || true
            echo "=== server blocks overview ==="
            awk '
              /^[[:space:]]*server[[:space:]]*\{/ {s=1; n=0; ssl="-"; listen="-"}
              s && /listen/ {listen=$0}
              s && /ssl_certificate / {ssl="ssl"}
              s && /server_name/ {n=$0}
              s && /ghost-img-proxy:gimg:begin/ {print "HAS_GIMG", ssl, listen, n}
              s && /^[[:space:]]*location/ { if($0 ~ /gimg|\/ /) print " LOC", $0 }
              s && /^\}/ {s=0}
            ' /etc/nginx/sites-enabled/freshrss
            echo "=== show gimg blocks ==="
            grep -n "gimg\|server_name\|listen \|location " /etc/nginx/sites-enabled/freshrss | head -n 80
