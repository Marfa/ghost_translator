name: Debug ghost img proxy

on:
  workflow_dispatch:

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug from VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "=== curl gimg ==="
            curl -sSI --connect-timeout 10 --max-time 20 \
              'https://feeds.themarfa.name/gimg/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg' \
              | head -n 15 || true
            echo "=== curl img ==="
            curl -v --connect-timeout 10 --max-time 20 -o /dev/null \
              'https://img.themarfa.name/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg' 2>&1 | tail -n 40 || true
            echo "=== curl img -k ==="
            curl -k -sS -o /dev/null -w 'code=%{http_code} ssl=%{ssl_verify_result}\n' --connect-timeout 10 --max-time 20 \
              'https://img.themarfa.name/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg' || true
            echo "=== cert files ==="
            ls -la /etc/letsencrypt/live/img.themarfa.name/ 2>&1 || true
            echo "=== nginx img site ==="
            ls -la /etc/nginx/sites-enabled/img.themarfa.name /etc/nginx/sites-available/img.themarfa.name 2>&1 || true
            nginx -T 2>/dev/null | awk '/server_name img.themarfa.name/,/^}/' | head -n 80 || true
            echo "=== openssl s_client ==="
            echo | openssl s_client -connect img.themarfa.name:443 -servername img.themarfa.name 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 || true
            echo "=== resolve ==="
            getent ahostsv4 img.themarfa.name bot.themarfa.name || true