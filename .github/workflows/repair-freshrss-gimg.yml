name: Repair FreshRSS nginx + install gimg

on:
  workflow_dispatch:

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair freshrss site and install gimg
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            CONF=/etc/nginx/sites-enabled/freshrss
            BAKDIR=/root/nginx-site-backups
            mkdir -p "$BAKDIR"

            echo "=== move *.bak.* out of sites-enabled (nginx includes them!) ==="
            shopt -s nullglob
            for bak in /etc/nginx/sites-enabled/*.bak.*; do
              echo "moving $bak"
              mv -f "$bak" "$BAKDIR/"
            done
            # also sites-available
            for bak in /etc/nginx/sites-available/*.bak.*; do
              echo "moving $bak"
              mv -f "$bak" "$BAKDIR/"
            done

            echo "=== nginx -t after moving backups ==="
            if ! nginx -t; then
              echo "Still broken; try restoring freshrss from moved backups"
              for bak in $(ls -1t "$BAKDIR"/freshrss.bak.* 2>/dev/null); do
                echo "try $bak"
                cp -a "$bak" "$CONF"
                if nginx -t 2>/dev/null; then
                  echo "GOOD restore: $bak"
                  break
                fi
              done
            fi
            nginx -t
            systemctl reload nginx

            echo "=== pull ghost-img-proxy and install ==="
            APP=/opt/ghost-img-proxy
            if [[ -d $APP/.git ]]; then
              cd $APP && git fetch --prune origin && git reset --hard origin/main
            else
              git clone https://github.com/Marfa/ghost-img-proxy.git $APP
              cd $APP
            fi
            # Install writes new baks next to conf — keep them OUT of sites-enabled
            bash scripts/install_vps.sh
            # Move any new baks immediately
            for bak in /etc/nginx/sites-enabled/*.bak.*; do
              [[ -e "$bak" ]] || continue
              mv -f "$bak" "$BAKDIR/"
            done
            nginx -t
            systemctl reload nginx

            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 \
              "https://feeds.themarfa.name/gimg/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg" || echo fail)
            echo "feeds_gimg=$code"
            test "$code" = "200"
